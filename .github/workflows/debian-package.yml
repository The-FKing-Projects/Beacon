name: Debian package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/debian-package.yml"
      - "debian/**"
      - "src/**"
      - "tests/**"
      - "scripts/release.py"
  pull_request:
    paths:
      - ".github/workflows/debian-package.yml"
      - "debian/**"
      - "src/**"
      - "tests/**"
      - "scripts/release.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - debian:13
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
    container: ${{ matrix.image }}
    env:
      LC_ALL: C
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Debian packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper dpkg-dev python3 ca-certificates

      - name: Run deterministic regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Build the binary package
        run: dpkg-buildpackage -us -uc -b

      - name: Inspect the package and smoke-test its CLI
        run: |
          package="../beacon_$(dpkg-parsechangelog -SVersion)_all.deb"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          apt-get install -y "$package"
          python3 tests/smoke_installed.py
