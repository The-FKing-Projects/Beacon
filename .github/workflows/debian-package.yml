name: Debian package

on:
  pull_request:
    paths:
      - ".github/workflows/debian-package.yml"
      - "debian/**"
      - "src/**"
      - "scripts/release.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper dpkg-dev

      - name: Build the binary package
        run: dpkg-buildpackage -us -uc -b

      - name: Inspect the package and smoke-test its CLI
        run: |
          package="../beacon_$(dpkg-parsechangelog -SVersion)_all.deb"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          sudo apt install -y "$package"
          beacon --version
          help_output="$(beacon --help)"
          printf '%s\n' "$help_output"
          ! grep -Fq 'beacon.py' <<< "$help_output"
          grep -Fq 'beacon --scan' <<< "$help_output"
          beacon --scan
          beacon --repos
          beacon --clean
          beacon --local
