name: Publish Debian package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the Debian package for
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: beacon-deb-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag in vMAJOR.MINOR.PATCH form." >&2
            exit 1
          fi
          release_tag="$(gh release view "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$release_tag" != "$INPUT_TAG" ]; then
            echo "No GitHub Release found for $INPUT_TAG." >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper dpkg-dev

      - name: Verify the Debian package version matches the release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          expected="${TAG#v}-1"
          actual="$(dpkg-parsechangelog -SVersion)"
          if [ "$actual" != "$expected" ]; then
            echo "Release $TAG expects Debian version $expected, found $actual." >&2
            exit 1
          fi

      - name: Build the binary package
        run: dpkg-buildpackage -us -uc -b

      - name: Inspect the package and smoke-test its CLI
        run: |
          package="../beacon_$(dpkg-parsechangelog -SVersion)_all.deb"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          mkdir package-root
          dpkg-deb --extract "$package" package-root
          python3 package-root/usr/lib/beacon/beacon.py --version

      - name: Upload the package to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          package="../beacon_$(dpkg-parsechangelog -SVersion)_all.deb"
          gh release upload "$TAG" "$package" --clobber

      - name: Dispatch APT publication after the release asset is ready
        if: >-
          github.repository == 'The-FKing-Projects/Beacon' &&
          github.ref == 'refs/heads/main' &&
          vars.APTLY_PUBLISH_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh workflow run publish-aptly.yml --repo "$GITHUB_REPOSITORY" \
            --ref main -f "tag=$TAG"
