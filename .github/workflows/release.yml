name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump for changes already on main
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      title:
        description: Short description of the changes being released
        required: true
        type: string
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: beacon-release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.deleted == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify the release source
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.after }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TITLE: ${{ inputs.title }}
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import uuid

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              title = os.environ["MANUAL_TITLE"]
              bump = os.environ["MANUAL_BUMP"]
              if not title.strip() or "\n" in title or "\r" in title:
                  raise SystemExit("Release title must be nonempty and contain no line breaks.")
              if bump not in ("patch", "minor", "major"):
                  raise SystemExit("Choose an explicit patch, minor, or major version bump.")
              values = {
                  "found": "true",
                  "title": title,
                  "body": "",
                  "number": "",
                  "manual_run_id": os.environ["GITHUB_RUN_ID"],
                  "reference": f"workflow run {os.environ['GITHUB_RUN_ID']}",
                  "marker": f"Beacon-Manual-Run: {os.environ['GITHUB_RUN_ID']}",
              }
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  for name, value in values.items():
                      delimiter = f"EOF_{uuid.uuid4().hex}"
                      output.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")
              raise SystemExit(0)

          result = subprocess.run(
              [
                  "gh",
                  "api",
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/"
                  f"{os.environ['COMMIT_SHA']}/pulls",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          pull_requests = [
              pull_request
              for pull_request in json.loads(result.stdout)
              if pull_request.get("merged_at")
              and pull_request.get("base", {}).get("ref") == "main"
          ]

          if not pull_requests:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("found=false\n")
              print("No merged pull request found for this main-branch commit.")
              raise SystemExit(0)

          if len(pull_requests) != 1:
              raise SystemExit(
                  f"Expected one merged pull request for commit, found "
                  f"{len(pull_requests)}; refusing an ambiguous release."
              )

          pull_request = pull_requests[0]
          values = {
              "found": "true",
              "number": str(pull_request["number"]),
              "title": pull_request["title"],
              "body": pull_request.get("body") or "",
              "manual_run_id": "",
              "reference": f"#{pull_request['number']}",
              "marker": f"Beacon-PR: #{pull_request['number']}",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, value in values.items():
                  delimiter = f"EOF_{uuid.uuid4().hex}"
                  output.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")
          PY

      - name: Prepare release version
        if: steps.pull-request.outputs.found == 'true'
        id: plan
        env:
          PR_TITLE: ${{ steps.pull-request.outputs.title }}
          PR_BODY: ${{ steps.pull-request.outputs.body }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          MANUAL_RUN_ID: ${{ steps.pull-request.outputs.manual_run_id }}
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          git fetch origin main --tags
          git checkout -B release-main origin/main
          if [ -n "$MANUAL_RUN_ID" ]; then
            origin=(--manual-run-id "$MANUAL_RUN_ID" --bump "$MANUAL_BUMP")
          else
            origin=(--pr-number "$PR_NUMBER")
          fi
          python3 scripts/release.py \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            "${origin[@]}" \
            --version-file src/beacon.py \
            --changelog-file debian/changelog

      - name: Create and push release tag
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.reused == 'false'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
          BUMP: ${{ steps.plan.outputs.bump }}
          RELEASE_REFERENCE: ${{ steps.pull-request.outputs.reference }}
          RELEASE_MARKER: ${{ steps.pull-request.outputs.marker }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/beacon.py debian/changelog
          git commit \
            -m "chore(release): v$VERSION" \
            -m "SemVer $BUMP release for $RELEASE_REFERENCE."
          git tag -a "$TAG" -m "Beacon $TAG" -m "$RELEASE_MARKER"
          git push --atomic origin HEAD:main "refs/tags/$TAG"

      - name: Check out the exact release tag
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: git checkout --detach "$TAG"

      - name: Publish GitHub Release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_REFERENCE: ${{ steps.pull-request.outputs.reference }}
          PR_TITLE: ${{ steps.pull-request.outputs.title }}
        run: |
          existing="$(gh release list --limit 1000 --json tagName --jq '.[].tagName')"
          if printf '%s\n' "$existing" | grep -Fxq -- "$TAG"; then
            echo "Release $TAG already exists."
            exit 0
          fi

          gh release create "$TAG" \
            --title "Beacon $TAG" \
            --notes "Release for $RELEASE_REFERENCE: $PR_TITLE"

      - name: Install Debian packaging tools
        if: steps.plan.outputs.release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper dpkg-dev

      - name: Verify the Debian package version matches the release
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          expected="${TAG#v}-1"
          actual="$(dpkg-parsechangelog -SVersion)"
          if [ "$actual" != "$expected" ]; then
            echo "Release $TAG expects Debian version $expected, found $actual." >&2
            exit 1
          fi

      - name: Build the binary package
        if: steps.plan.outputs.release == 'true'
        run: dpkg-buildpackage -us -uc -b

      - name: Inspect the package and smoke-test its CLI
        if: steps.plan.outputs.release == 'true'
        run: |
          package="../beacon_$(dpkg-parsechangelog -SVersion)_all.deb"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          mkdir package-root
          dpkg-deb --extract "$package" package-root
          python3 package-root/usr/lib/beacon/beacon.py --version

      - name: Upload the package to the GitHub Release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          package="../beacon_$(dpkg-parsechangelog -SVersion)_all.deb"
          gh release upload "$TAG" "$package" --clobber

      - name: Dispatch APT publication after the release asset is ready
        if: >-
          github.repository == 'The-FKing-Projects/Beacon' &&
          steps.plan.outputs.release == 'true' &&
          vars.APTLY_PUBLISH_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh workflow run publish-aptly.yml --repo "$GITHUB_REPOSITORY" \
            --ref main -f "tag=$TAG"
