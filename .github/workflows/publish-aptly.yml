name: Publish to aptly

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to publish to APT
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    # workflow_dispatch: only from main. release published: tag event (not main),
    # so require a non-draft, non-prerelease release instead of refs/heads/main.
    if: >-
      github.repository == 'The-FKing-Projects/Beacon' &&
      vars.APTLY_PUBLISH_ENABLED == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'release' &&
          github.event.action == 'published' &&
          github.event.release.draft == false &&
          github.event.release.prerelease == false
        )
      )
    runs-on:
      - self-hosted
      - Linux
      - X64
      - fkingprojects
    timeout-minutes: 15
    steps:
      - name: Download the released package and update the signed APT publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "The-FKing-Projects/Beacon" ]; then
            echo "APT publication is limited to The-FKing-Projects/Beacon." >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
              echo "Manual APT publication requires workflow_dispatch on main." >&2
              exit 1
            fi
          elif [ "$EVENT_NAME" = "release" ]; then
            if [[ "$WORKFLOW_REF" != refs/tags/v* ]]; then
              echo "Release APT publication requires a vMAJOR.MINOR.PATCH tag ref." >&2
              exit 1
            fi
          else
            echo "Unsupported event for APT publication: $EVENT_NAME" >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag in vMAJOR.MINOR.PATCH form." >&2
            exit 1
          fi
          for tool in gh dpkg-deb aptly flock; do
            if ! command -v "$tool" >/dev/null; then
              echo "Required runner tool is missing: $tool" >&2
              exit 1
            fi
          done

          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          version="${TAG#v}-1"
          filename="beacon_${version}_all.deb"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$filename" --dir "$work"
          package="$work/$filename"
          if [ "$(dpkg-deb -f "$package" Package)" != "beacon" ] ||
             [ "$(dpkg-deb -f "$package" Version)" != "$version" ] ||
             [ "$(dpkg-deb -f "$package" Architecture)" != "all" ]; then
            echo "Release asset metadata does not match beacon $version (all)." >&2
            exit 1
          fi

          mkdir -p "$HOME/.cache"
          exec 9>"$HOME/.cache/beacon-aptly-publish.lock"
          flock --exclusive --wait 600 9
          aptly repo add fkingprojects "$package"
          aptly publish update -batch=true -skip-signing=false stable .
